name: Cache authentic book cover images
on:
  push:
    paths:
      - 'scripts/sync_book_covers.py'
      - '.github/workflows/cache-book-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-book-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet requests Pillow
      - name: Fetch published cover art and update local README references
        run: python scripts/sync_book_covers.py
      - name: Commit downloaded cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/covers
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache real published book covers in repository"
            git push
          fi
